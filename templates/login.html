<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · November 2026 Enrollments</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#082b86 url('{{ url_for('static', filename='images/asw-noviembre-2026.jpeg') }}') center top / cover fixed no-repeat;font-family:'Segoe UI',Arial,sans-serif;color:#1a2340}.card{width:min(420px,92vw);background:rgba(255,255,255,.96);backdrop-filter:blur(3px);border-radius:18px;padding:30px;box-shadow:0 10px 35px #1a3fa81a}.logo{font-size:38px;text-align:center}.brand{text-align:center;font-size:21px;font-weight:900;margin-top:8px}.sub{text-align:center;color:#667396;font-size:12px;margin:5px 0 24px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:800;color:#667396;text-transform:uppercase;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d0d9f0;border-radius:9px;font-size:15px}.btn{width:100%;border:0;border-radius:9px;padding:12px;background:#1a3fa8;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.error{background:#fff0f0;color:#a51d1d;border:1px solid #f2c3c3;padding:10px;border-radius:9px;font-size:12px;margin-bottom:14px}.note{text-align:center;color:#8a96b2;font-size:11px;margin-top:18px;line-height:1.5}
</style></head><body><main class="card"><div class="logo">🎓</div><div class="brand">American School Way</div><div class="sub">Enrollment System · November 2026 Campaign</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Log in</button></form><div class="note">Authorized access for enrollment staff.</div></main></body></html>
