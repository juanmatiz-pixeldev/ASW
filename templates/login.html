<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso · Sistema de Black November 2026</title>
<style>
:root{color-scheme:dark;--cyan:#00f5ff;--pink:#ff2bd6;--violet:#8b5cf6;--bg:#050713;--panel:rgba(10,14,34,.92);--muted:#a8b4d6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,rgba(3,6,20,.62),rgba(9,10,35,.70)),url('{{ url_for('static', filename='images/asw-noviembre-2026.jpeg') }}') center/cover fixed no-repeat;font-family:'Segoe UI',Arial,sans-serif;color:#f4f7ff}
.card{width:min(430px,94vw);background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(0,245,255,.55);border-radius:22px;padding:34px;box-shadow:0 0 12px rgba(0,245,255,.28),0 0 42px rgba(139,92,246,.22),inset 0 0 28px rgba(0,245,255,.045)}
.logo{font-size:42px;text-align:center;filter:drop-shadow(0 0 10px var(--cyan))}.brand{text-align:center;font-size:23px;font-weight:900;margin-top:10px;letter-spacing:.3px;text-shadow:0 0 12px rgba(0,245,255,.55)}.sub{text-align:center;color:var(--muted);font-size:11px;margin:7px 0 27px;letter-spacing:1.4px;text-transform:uppercase}
.field{margin-bottom:17px}.field label{display:block;font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid rgba(139,160,210,.36);border-radius:10px;font-size:15px;background:#080d20;color:#fff;outline:none;transition:.2s}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,255,.12),0 0 15px rgba(0,245,255,.15)}
.btn{width:100%;border:1px solid var(--cyan);border-radius:10px;padding:13px;background:linear-gradient(100deg,rgba(0,245,255,.2),rgba(139,92,246,.28));color:#fff;font-weight:900;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 16px rgba(0,245,255,.2);transition:.2s}.btn:hover{background:linear-gradient(100deg,rgba(0,245,255,.34),rgba(255,43,214,.28));box-shadow:0 0 24px rgba(0,245,255,.35);transform:translateY(-1px)}
.error{background:rgba(255,50,90,.12);color:#ff9aae;border:1px solid rgba(255,70,110,.5);padding:11px;border-radius:9px;font-size:12px;margin-bottom:15px}.note{text-align:center;color:#8290b7;font-size:11px;margin-top:20px;line-height:1.5}
</style></head><body><main class="card"><div class="logo">🎓</div><div class="brand">American School Way</div><div class="sub">Sistema de matrículas · Black November 2026</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Log in</button></form><div class="note">Authorized access for enrollment staff.</div></main></body></html>
