services:
  - type: web
    name: american-school-way-matriculas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: american-school-way-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: NORTE_PASSWORD
        sync: false
      - key: SAN_FERNANDO_PASSWORD
        sync: false
      - key: LIMONAR_PASSWORD
        sync: false

databases:
  - name: american-school-way-db
    databaseName: matriculas
    plan: free
